approved_one_sided_ic_inference_amendment:
  approved_on: 2026-09-12
  status: complete
  rationale: >-
    A directional prior held before results were examined (the signal, and any incremental
    difference between signals, is expected to be positive if real), not a reaction to
    already-observed results.
  scope:
    applies_to: [standalone_S0_S1_S2_mean_rank_ic_tests, paired_mean_rank_ic_difference_tests]
    applies_to_phases: [phase_5, phase_6_regression_coefficients, phase_7, phase_7a, phase_7b, phase_8]
    excludes_unchanged_and_still_two_sided:
      - phase_10_portfolio_return_hac_tests
      - phase_11_placebo_permutation_test
      - decile_monotonicity_diagnostics
      - any_long_short_or_portfolio_return_hac_test_in_any_phase
  hypotheses:
    standalone: {h0: mean_rank_ic_less_than_or_equal_zero, ha: mean_rank_ic_greater_than_zero}
    paired: {h0: mean_rank_ic_difference_less_than_or_equal_zero, ha: mean_rank_ic_difference_greater_than_zero}
  prior_rule: two_sided_hac5_t_stat_absolute_value_at_least_2
  new_rule: one_sided_hac5_t_stat_at_least_1_645
  new_critical_value: 1.645
  critical_value_basis: standard_one_sided_5_percent_cutoff_under_normal_approximation_stats_norm_sf
  recompute_policy: no_raw_signal_panel_or_t_statistic_recomputed_only_pass_fail_label_and_primary_supplementary_labeling_change
  implementation:
    helper_module: src/one_sided_ic_inference.py
    phase_8_decision_rerun_script: src/apply_one_sided_ic_amendment_phase8.py
    phase_8_decision_output: results/tables/phase8_decision_rule_evaluation_one_sided_amendment_2026-09-12.json
    original_phase_8_decision_output_unchanged: results/tables/phase8_decision_rule_evaluation.json
    original_output_preserved_because: checksum_pinned_in_phase_9_10_11_preservation_manifests
  verdicts_that_flip_fail_to_pass:
    - result: original_period_S0_full_sample_mean_ic
      hac5_t: 1.899716
      sources: [docs/phase5_naive_signal_report.md, docs/phase6_confound_analysis_report.md, docs/liquidity_universe_correction_report.md, docs/phase7b_candidate_history_report.md, config/research_config.yaml#historical_extension_phase_7a.frozen_phase_7b_benchmarks.s0_full_hac5_ic_t]
    - result: original_period_S0_paired_mean_ic_candidate_history
      hac5_t: 1.830747
      sources: [docs/phase7b_candidate_history_report.md, docs/phase7a_report.md, docs/phase8_report.md, config/research_config.yaml#historical_extension_phase_7a.frozen_phase_7b_benchmarks.s0_paired_hac5_ic_t]
      note: this_is_the_result_the_sponsor_specifically_flagged
    - result: original_period_S0_paired_mean_ic_member_history_superseded_architecture
      hac5_t: 1.737318
      sources: [docs/phase7_abnormal_signal_report.md]
      note: member_history_architecture_is_no_longer_primary_but_result_is_documented_and_unchanged
  verdicts_confirmed_unchanged_still_fail:
    - result: additional_S2_minus_S1_paired_ic_difference
      hac5_t: 1.562703
      note: closest_paired_difference_to_the_new_bar_still_fails
    - result: additional_S2_minus_S0_paired_ic_difference
      hac5_t: 0.315648
    - result: original_S2_minus_S0_paired_ic_difference
      hac5_t: 0.291257
    - result: original_S2_minus_S1_paired_ic_difference
      hac5_t: -0.897851
    - result: phase7_member_history_paired_S1_minus_S0_ic_difference
      hac5_t: 1.035865
    - result: phase7b_candidate_history_paired_S1_minus_S0_ic_difference
      hac5_t: 0.62794
    - result: phase7a_additional_paired_S1_minus_S0_ic_difference
      hac5_t: -0.332215
    - result: phase6_regression_coefficient_rank_S0_model_1
      hac5_t: 0.782473
    - result: phase6_regression_coefficient_rank_S0_model_2
      hac5_t: 1.00256
    - result: phase6_regression_coefficient_rank_S0_model_3
      hac5_t: 1.001267
  phase_8_leading_candidate_rule_verdict: unchanged_still_retain_S1_S2_is_informative_robustness_test
