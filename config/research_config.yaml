features:
  raw_short_volume_ratio:
    numerator: short_volume
    denominator: total_reported_volume
    zero_denominator: missing
  volume_surprise:
    formula: log(volume_t / median(volume_t_minus_20_to_t_minus_1))
    lookback_trading_days: 20
    minimum_history: 20
  realized_volatility:
    lookback_trading_days: null # Optional extension only.
  abnormal_short_volume:
    lookback_trading_days: 60
    center: median
    dispersion: mad
    mad_scale: 1.4826
    epsilon: 0.000001
    history_includes_current_day: false
  state_conditioning:
    status: optional_extension_only
    volume_surprise_buckets: 5
    volatility_buckets: 5
    cell_statistic: cross_sectional_median_abnormal_score

signal:
  primary_comparison: [raw_finra_short_volume_ratio, stock_relative_60_day_median_mad_abnormality]
  raw_alpha: negative_abnormal_short_volume
  final_transformation: cross_sectional_rank_as_portfolio_representation
  rank_formula: (rank_minus_0_5_divided_by_n_times_2)_minus_1

target:
  primary_horizon: next_trading_day_open_to_close
  formula: adjusted_close_t_plus_1_divided_by_adjusted_open_t_plus_1_minus_1
  feature_cutoff: end_of_day_t
  locked_primary_evaluation_start: 2025-05-28
  locked_primary_evaluation_end: 2026-08-31
  calendar_policy: immediately_following_shared_market_session_no_security_specific_shift

portfolio:
  long_quantile: 0.10
  short_quantile: 0.10
  weighting: equal_dollar_within_leg
  long_exposure: 0.50
  short_exposure: -0.50
  gross_exposure: 1.00
  turnover_formula: 0.5_times_sum_abs_weight_change
  round_trip_cost_bps: [5, 10, 20]

evaluation:
  primary_signal_metric: daily_spearman_rank_ic
  icir_annualization_days: 252
  primary_portfolio_metric: top_decile_minus_bottom_decile_open_to_close_return
  primary_confound: same_day_return_short_term_reversal
  optional_extensions:
    - volume_volatility_5x5_conditioning
    - sector_and_market_cap_analysis
    - alternative_horizons
    - placebo_tests
    - flow_versus_inventory_analysis
    - extensive_transaction_cost_analysis
  naive_signal_phase_5:
    evaluation_window: [2025-05-28, 2026-08-31]
    ratio_formula: ShortVolume_divided_by_TotalVolume
    naive_alpha_formula: negative_raw_finra_ratio
    expected_s0_rank_ic_sign: positive
    raw_q_equivalent_expected_ic_sign: negative
    ratio_bounds_tolerance: 1.0e-12
    rank_tie_rule: stable_first_rank_after_canonical_symbol_sort
    decile_rule: approximately_equal_count_floor_rank_times_10_divided_by_n_plus_1
    hac_newey_west_lags: 5
    predefined_subperiods:
      - [2025-05-28, 2026-01-13]
      - [2026-01-14, 2026-08-31]
    directionally_supportive_if: mean_rank_ic_positive_and_mean_top_minus_bottom_decile_return_positive
    statistically_convincing_if:
      # Amended 2026-09-12: replaces two_sided_hac_rank_ic_t_stat_at_least_2 (see
      # approved_one_sided_ic_inference_amendment). The long_short return criterion below is
      # a portfolio-return test and is unaffected; it remains two-sided as originally defined.
      - one_sided_hac_rank_ic_t_stat_at_least_1_645
      - reasonably_monotonic_decile_profile
      - positive_long_short_return
      - positive_rank_ic_in_both_predefined_subperiods
    performance_label: gross_illustrative_no_transaction_costs
  confound_analysis_phase_6:
    evaluation_window: [2025-05-28, 2026-08-31]
    same_day_return_formula: adjusted_close_t_divided_by_adjusted_open_t_minus_1
    reversal_formula: negative_same_day_open_to_close_return
    volume_surprise_formula: log_volume_t_divided_by_median_of_20_strictly_prior_valid_volume_observations
    volume_surprise_lookback_valid_observations: 20
    realized_volatility_formula: sample_standard_deviation_of_20_strictly_prior_valid_close_to_close_returns_ending_t_minus_1
    realized_volatility_lookback_valid_returns: 20
    history_includes_current_day: false
    regression_common_sample: intersection_of_nonmissing_s0_reversal_volume_surprise_realized_volatility_and_forward_return
    regression_rank_normalization: daily_average_tie_percentile_rank_scaled_to_minus1_plus1
    regression_rank_formula: 2_times_open_paren_rank_average_minus_0_5_close_paren_divided_by_n_minus_1
    hac_newey_west_lags: 5
    predefined_subperiods:
      - [2025-05-28, 2026-01-13]
      - [2026-01-14, 2026-08-31]
    interpretation: associational_not_causal
  abnormal_signal_phase_7:
    evaluation_window: [2025-05-28, 2026-08-31]
    shared_calendar_history_dates: 60
    history_window: t_minus_60_through_t_minus_1
    require_all_prior_q_observations: true
    permit_backward_history_substitution: false
    historical_center: median
    historical_dispersion: median_absolute_deviation
    mad_scale: 1.4826
    epsilon: 0.000001
    primary_z_transformation: none
    primary_alpha: negative_z
    primary_rank_use: ic_and_decile_assignment_only
    decile_tie_rule: stable_first_rank_after_canonical_symbol_sort
