approved_S2_primary_promotion_override_2026_09_12:
  approved_on: 2026-09-12
  status: active
  decision: S2_promoted_to_primary
  decision_type: explicit_governance_override_not_a_data_driven_result
  decision_statement: >-
    S2 is promoted to primary, replacing S1. S1 becomes former primary, now robustness comparator,
    reported prominently alongside S2 going forward, not diminished for having lost the primary
    label. S0 is unchanged as baseline. This is a deliberate sponsor decision made in full view of
    an unmet pre-registered promotion criterion and a materially weaker placebo result for the
    promoted signal; it is not presented as data-driven and must not be described as satisfying
    Phase 8's original promotion rule.
  new_roles:
    S2: {role: primary, previously: robustness_comparator}
    S1: {role: former_primary_now_comparator, previously: primary}
    S0: {role: baseline, previously: baseline, change: none}
  reporting_requirement: >-
    S1's unresolved paired comparison against S2 (Phase 8) and S2's weaker placebo result relative
    to S1 (Phase 15) must both remain visible in all future reporting. Neither may be omitted,
    softened, or reworded because S1 no longer carries the primary label.
  pre_registered_phase_8_promotion_rule:
    rule: paired_S2_minus_S1_mean_rank_ic_difference_positive_and_hac_significant_in_both_samples
    source: evaluation.conditional_abnormal_signal_phase_8.leading_candidate_rule.paired_s2_minus_s1_ic_positive_both_samples
    met_at_phase_8_original_two_sided_standard: false
    additional_sample: {mean_ic_difference: 0.001763, hac5_t: 1.562703, note: positive_but_below_the_then_current_two_sided_bar_of_2}
    original_sample: {mean_ic_difference: -0.001168, hac5_t: -0.897851, note: negative}
    met_under_2026_09_12_one_sided_ic_amendment_t_at_least_1_645: false
    note: >-
      Under the amended one-sided t>=1.645 primary rule for paired IC-difference tests
      (approved_one_sided_ic_inference_amendment above), the additional-sample difference
      (t=1.5627) still falls short of 1.645, and the original-sample difference remains negative.
      The pre-registered Phase 8 promotion rule was not met under either standard. This override
      does not claim otherwise.
  reasons_cited_for_override:
    reason_1_phase_8_standalone_metrics:
      source: docs/phase8_report.md
      detail: >-
        S2's standalone HAC(5) IC t-statistic and gross long-short Sharpe exceed S1's in both
        samples (additional: t 3.48 vs 2.51, Sharpe 1.61 vs 1.22; original: t 2.55 vs 2.59 -- S1's
        is marginally higher here -- Sharpe 1.42 vs 0.91). Mean Rank IC exceeds S1's in the
        additional sample (0.00832 vs 0.00655) but not the original sample, where S1's mean IC
        (0.01295) is higher than S2's (0.01178). This override does not claim S2 dominates S1 on
        every individual metric in every sample; it cites the pattern accurately, not selectively.
        See docs/phase8_report.md's own table for the complete, authoritative figures.
    reason_2_phase_14_market_neutrality:
      source: docs/phase14_market_neutrality_report.md
      detail: >-
        S2's gross standalone alpha clears the one-sided primary bar (HAC(5) t=1.710573, p=0.04358)
        with a clean, statistically insignificant beta (-0.003562, t=-0.227360, p=0.820144). S1's
        gross alpha narrowly misses the same bar (t=1.619474, p=0.052673) and, unlike S2, S0 (not
        S1) was flagged for a significant beta in that phase; S1's own beta was small and
        unflagged (0.011045, t=0.599268).
    reason_3_phase_15_robustness_battery:
      source: docs/phase15_robustness_S2_report.md
      detail: >-
        S2 matches or beats S1 on time-stability (HAC-lag sensitivity, calendar-year and
        half-split gross means), the fixed-universe diagnostic, the liquidity-neutral control,
        leave-one-calendar-year-out sign stability, and has meaningfully smaller single-day tail
        risk (worst day -38.39 bps vs S1's -137.95 bps, additional sample; -49.71 vs -61.61 bps,
        original sample).
      caveat_disclosed_plainly_not_glossed_over: >-
        S2 is notably weaker than S1 on the deterministic within-date placebo/permutation test.
        S2's actual gross mean beats only approximately 98% of 1,000 random within-date score
        permutations (empirical one-sided p = 0.019980 additional, 0.017982 original). S1's beat
        essentially all of them (p = 0.000999 in both samples, the minimum attainable value with
        1,000 permutations under the plus-one convention). This is recorded as a known, accepted
        weakness in the promoted signal, not a reason to withhold the promotion, and not something
        to be omitted from any future summary of S2's standing.
  supersedes_as_current_governance_only_originals_preserved_verbatim:
    - evaluation.final_rank_score_phase_9.roles
    - evaluation.final_rank_score_phase_9.primary_score_field
    - evaluation.realistic_portfolio_backtest_phase_10.frozen_signal_roles
    - evaluation.robustness_falsification_phase_11.frozen_primary
    - evaluation.robustness_falsification_phase_15_s2.governance_clarification
    - evaluation.robustness_falsification_phase_15_s2.results.headline_conclusion
    - approved_one_sided_ic_inference_amendment.phase_8_leading_candidate_rule_verdict
    - results/tables/phase9_signal_governance.csv
  supersession_policy: >-
    Every field and report listed above is preserved byte-for-byte unchanged as the accurate
    historical record of what was decided at the time. This block is the current authoritative
    statement of signal roles going forward. It does not rewrite, delete, or reword any prior
    finding or conclusion.
  new_governance_artifact: results/tables/phase9_signal_governance_amended_2026-09-12.csv
  full_writeup: docs/s2_primary_promotion_governance_override.md
  recomputation_required: none
  recomputation_rationale: >-
    Phase 9's S2_bounded_rank_score, Phase 10's S2_continuous backtest, Phase 14's S2 alpha/beta,
    and Phase 15's S2 robustness suite already exist, frozen and unchanged. This is a role and
    label metadata change only; no signal, panel, backtest, or statistic was recomputed.
  affected_but_not_recomputed:
    - data/processed/phase9_final_rank_score_panel.parquet
    - data/processed/phase10_daily_portfolio_exposure_panel.parquet
    - data/processed/phase10_daily_portfolio_returns_by_cost.parquet
    - results/tables/phase14_market_model_results.csv
    - results/tables/phase15_robustness_summary.csv
  prohibited:
    - rewriting_or_deleting_any_historical_phase_report_finding
    - rewording_phase_8_phase_11_or_phase_15_original_conclusions
    - hiding_the_unmet_phase_8_promotion_criterion
    - hiding_the_phase_15_placebo_gap
    - recomputing_any_frozen_signal_panel_or_backtest
    - describing_this_override_as_data_driven_or_as_satisfying_the_phase_8_rule
    - removing_or_diminishing_S1_visibility_in_future_reporting

